# Continuous integration for Flowable Atlas.
#
# Two jobs on purpose. `build` is the fast gate every push gets. `verify-plugin` is separate because it
# downloads two full IntelliJ IDEA distributions (several GB) and takes minutes — worth it, but not worth
# blocking the quick feedback on.
#
# Why this exists at all: before it, "everything is green" was a statement about one laptop. Two gates in
# particular could never run unattended — `verifyPlugin` needed a locally installed IDE passed by hand,
# and the browser-driven frontend tests skip themselves when no browser is present. The second one is why
# ATLAS_REQUIRE_BROWSER_TESTS exists: on a runner without Chrome those tests would report success having
# opened nothing, and a pipeline that claims coverage it does not have is worse than no pipeline.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the old run; main is left alone so its history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    env:
      # Turns "no node/Chrome, so skip" into a hard failure. See cli/build.gradle.kts and
      # scripts/*-uitest.mjs — the two halves of the same switch.
      ATLAS_REQUIRE_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Also validates gradle-wrapper.jar against Gradle's published checksums, which matters for a
      # public repo: a tampered wrapper jar would otherwise execute unnoticed on every run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail here, with a clear message, rather than deep inside a Gradle task. The runner image ships
      # Chrome; if a future image stops doing so, this is the line that says so.
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chrome/Chromium on this runner — the explorer UI tests cannot run."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "using $CHROME ($("$CHROME" --version))"

      # `build` runs the JVM suite, the goldens, the CLI contract tests, the search self-test and both
      # headless-Chrome UI tests. With ATLAS_REQUIRE_BROWSER_TESTS=1 the last three cannot silently skip.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 14

      # Only for `main`. A feature branch should not put an installable plugin ZIP on GitHub: it invites
      # someone to install a build that has not been reviewed or merged, and every branch would leave
      # another artifact behind. Releases are where a ZIP meant for installing comes from (see the
      # `release` job); a `main` build is the one place a pre-release artifact is useful for testing.
      #
      # Packaging itself is still exercised on every branch, because buildPlugin is wired into `build`
      # in idea-plugin/build.gradle.kts — so a broken package fails a pull request even though nothing
      # is uploaded from it. if-no-files-found stays `error`: on main the ZIP must exist.
      - name: Upload plugin ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: flowable-atlas-plugin
          path: idea-plugin/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  verify-plugin:
    name: JetBrains Plugin Verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Read-only on purpose. setup-gradle writes the whole Gradle home — for this project that is the
      # IntelliJ Platform SDK in `caches/modules-2` plus the same content again in `caches/transforms`,
      # several GB per distinct dependency set. Three jobs each saving their own variant filled the
      # repository's 10 GB Actions cache on its own, and once it is full GitHub evicts by age, which
      # throws away the `build` entry every other run and makes the cache slower than none.
      #
      # So `build` on the default branch is the only writer, and this job reuses what it saved. The
      # verifier's own IDE downloads are unaffected either way: the platform plugin puts them in
      # ~/.pluginVerifier, outside the Gradle home this caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The verifier unpacks an IDE distribution next to the compile SDK. A stock runner has enough room,
      # but not a lot of it to spare, so reclaim the pre-installed toolchains we do not use. Kept even
      # though only one IDE is verified now — the margin is what makes adding another one uneventful.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      # No -Patlas.verifyIdes here on purpose: without it the build DOWNLOADS the IDEs declared in
      # idea-plugin/build.gradle.kts (2026.2), which is what lets this gate run with no IDE
      # installed. That is the whole point — it is how a descriptor defect `build` cannot see (for
      # instance <change-notes> exceeding its 65535-character cap, which makes the artifact invalid)
      # gets caught before anyone installs the ZIP.
      - name: Verify against 2026.2
        run: ./gradlew :idea-plugin:verifyPlugin --stacktrace

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: idea-plugin/build/reports/pluginVerifier/**
          if-no-files-found: ignore
          retention-days: 14

  # Publishes the release artifacts. Runs only for a pushed version tag, and only after both gates are
  # green — a tag must never produce a release from a build that failed verification.
  #
  # This job is why the plugin ZIP and the CLI jar are no longer committed to the repository: binaries do
  # not delta-compress, so 87 stored copies had grown to 152 MB (86% of the repo) for files where only
  # the newest is ever useful. Attaching them here gives the same "download without building" that
  # committing them did, without the history cost — and the checksums are computed rather than
  # hand-maintained, so they cannot drift from the file they describe.
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-plugin]
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes. Creating a release and uploading assets needs it; nothing else here does.
      contents: write
    # Mapped here, not per step: the `secrets` context is NOT available in a step's `if:` (only
    # github/needs/strategy/matrix/job/runner/env/vars/steps/inputs are), so "was a key configured?"
    # has to be asked of `env`. Unset secrets arrive as empty strings, which is exactly the test below.
    env:
      ATLAS_CERTIFICATE_CHAIN: ${{ secrets.ATLAS_CERTIFICATE_CHAIN }}
      ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
      ATLAS_PRIVATE_KEY_PASSWORD: ${{ secrets.ATLAS_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Read-only, for the reason given in the verify job: `build` on the default branch is the single
      # cache writer. A tag build would otherwise save a fourth multi-GB variant that nothing reuses,
      # since the next tag has a different commit and this job runs once per release.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Built here rather than downloaded from the `build` job: the release assets must come from a
      # checkout of the tag itself, so what is published is exactly what the tag names.
      #
      # signPlugin is a no-op unless the three secrets below are set, and it says so in the log rather
      # than quietly shipping an unsigned ZIP (see the onlyIf in idea-plugin/build.gradle.kts). Atlas is
      # installed by side-loading a ZIP, with no Marketplace vouching for it — the signature is what
      # makes tampering between this runner and a colleague's IDE detectable. SHA256SUMS.txt cannot do
      # that job alone: whoever can replace the asset can replace its checksum line too.
      - name: Build release artifacts
        run: ./gradlew :idea-plugin:buildPlugin :idea-plugin:signPlugin :cli:shadowJar

      # Only meaningful when a key was configured; skipped otherwise so an unsigned release still works.
      - name: Verify the signature
        if: env.ATLAS_CERTIFICATE_CHAIN != ''
        run: ./gradlew :idea-plugin:verifyPluginSignature --stacktrace

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          # When signing ran, the signed ZIP REPLACES the unsigned one under the plain release name, so
          # there is exactly one plugin ZIP on the page and nobody has to choose. Two downloads that
          # differ only by a "-signed" suffix is how the unsigned one gets installed by accident.
          SIGNED="$(ls idea-plugin/build/distributions/*-signed.zip 2>/dev/null | head -1 || true)"
          if [ -n "$SIGNED" ]; then
            cp "$SIGNED" "release/$(basename "${SIGNED%-signed.zip}.zip")"
            echo "signed plugin ZIP: $SIGNED"
          else
            cp idea-plugin/build/distributions/*.zip release/
            echo "::warning::No signing key configured — publishing an UNSIGNED plugin ZIP."
          fi
          cp cli/build/libs/*-all.jar release/

          # The custom plugin repository. Published as a release asset rather than to GitHub Pages so it
          # has a URL that never changes — /releases/latest/download/ always resolves to the newest
          # release — and so it cannot collide with whatever else the Pages site deploys (a Pages
          # deployment replaces the whole site, so two workflows publishing there fight each other).
          # Generated from the PATCHED descriptor, so the compatibility range can never drift from the
          # plugin it advertises; see scripts/make-update-plugins.mjs for why that matters.
          TAG="${GITHUB_REF_NAME#v}"
          node scripts/make-update-plugins.mjs \
            idea-plugin/build/tmp/patchPluginXml/plugin.xml \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/flowable-atlas-$TAG.zip" \
            release/updatePlugins.xml

          # Checksum written outside the directory first, then moved in: `sha256sum * > SHA256SUMS.txt`
          # inside it can hash its own (just-truncated) output, depending on when the shell sets up the
          # redirection relative to expanding the glob.
          ( cd release && sha256sum ./* ) > SHA256SUMS.txt
          mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt

      # Fails the job when the tag and the built version disagree — otherwise `git tag v0.13.0` on a
      # tree that still says 0.12.2 would publish a release whose assets contradict its own name.
      - name: Check the tag matches the built version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [ ! -f "release/flowable-atlas-$TAG.zip" ]; then
            echo "::error::Tag $GITHUB_REF_NAME expects flowable-atlas-$TAG.zip, but the build produced:"
            ls -1 release/
            # Single quotes: backticks inside a double-quoted string would be command substitution,
            # so "Bump `version`" would try to execute `version`.
            echo '::error::Bump the version in the root build.gradle.kts to match the tag, or retag.'
            exit 1
          fi

      # The notes live in a YAML block scalar rather than a shell heredoc: inside `run: |` a heredoc
      # line starting with `*` (bold Markdown) is read by the YAML parser as an alias and breaks the
      # file. Indented under `env:` the same text is inert, and the shell just expands one variable.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            **Stay up to date automatically** — add this URL once, under
            *Settings → Plugins → ⚙ → Manage Plugin Repositories…*:

                https://github.com/${{ github.repository }}/releases/latest/download/updatePlugins.xml

            Atlas then joins the normal IDE update flow: a new release shows up as an available update,
            with no download and no *Install from Disk*. The URL is stable — it always resolves to the
            newest release.

            **Or install by hand** — download the ZIP and use
            *Settings → Plugins → ⚙ → Install Plugin from Disk…*, then restart the IDE.

            **CLI** — `java -jar cli-*-all.jar <project> --all` (needs a JRE 21+).

            Checksums are in `SHA256SUMS.txt`; the full history is in
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Flowable Atlas $GITHUB_REF_NAME" \
            --notes "$NOTES"
