<!doctype html>
<!-- The og:image. Rendered to assets/img/og-card.png by scripts/site-shots.mjs at 1200×630. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/site.css">
<style>
  html,body{width:1200px;height:630px;overflow:hidden}
  body{display:flex;flex-direction:column;justify-content:center;gap:28px;
       padding:0 84px;background:var(--panel);color:var(--ink)}
  .row{display:flex;align-items:center;gap:18px}
  .mark{width:76px;height:76px;border-radius:18px}
  h1{font-size:74px;letter-spacing:-.03em;line-height:1;font-weight:600}
  p{font-size:29px;color:var(--ink-dim);max-width:940px;line-height:1.45}
  .strip{display:flex;gap:12px;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:20px;color:var(--ink-dim);
        border:1px solid var(--line);border-radius:999px;padding:7px 20px;background:var(--panel2)}
  .rule{height:5px;width:132px;background:var(--accent);border-radius:3px}
</style></head>
<body>
  <div class="row">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="2" y="2" width="36" height="36" rx="8" fill="#0B5FFF"/>
      <circle cx="15" cy="16" r="6" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M19 20 L28 29" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M24 25 L27 22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M28 29 L31 26" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>Flowable Atlas</h1>
  </div>
  <div class="rule"></div>
  <p>Map any Flowable project — the app models <b>and</b> the Java code — into an explorer you can
  click through, artifacts an agent can query, and an IDE that checks every key.</p>
  <div class="strip">
    <span class="pill">explorer.html</span>
    <span class="pill">summary.md</span>
    <span class="pill">graph.json</span>
    <span class="pill">CLAUDE.md</span>
    <span class="pill">IntelliJ plugin</span>
  </div>
</body></html>
