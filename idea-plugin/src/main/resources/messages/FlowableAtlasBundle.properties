# Flowable Atlas — user-visible strings referenced from plugin.xml and shared code.
# Conventions: Title Case for action texts and dialog titles; ellipsis only when the action always
# needs further input; sentence case for notification titles (no "Flowable Atlas" prefix — the
# notification group already carries it).

## Tools menu group
group.Flowable.Menu.text=Flowable Atlas
group.Flowable.Menu.description=Flowable Atlas actions
group.Flowable.ProjectViewPopup.text=Flowable Atlas
group.Flowable.ProjectViewPopup.description=Atlas actions for the folder, model or archive under the cursor

## Actions — open
action.Flowable.OpenAtlasHub.text=Atlas Hub
action.Flowable.OpenAtlasHub.description=Show the Atlas Hub tool window: model-index status, generated explorers and Flowable Design sync in one place
action.Flowable.OpenAtlasExplorer.text=Open Atlas Explorer
action.Flowable.OpenAtlasExplorer.description=Open an already-generated Atlas explorer as a center editor tab (like a DB table); no regeneration, no browser
action.Flowable.SearchModels.text=Search Models…
action.Flowable.SearchModels.description=Open Search Everywhere on the Flowable Model tab: find models by key or file path — including the ones packed inside a .bar/.zip — and search their content
action.Flowable.OpenExpressionPlayground.text=Open Expression Playground
action.Flowable.OpenExpressionPlayground.description=Show the Flowable Expressions tool window to validate and evaluate backend/frontend expressions

## Actions — generate
group.Flowable.Generate.text=Generate
group.Flowable.Generate.description=Generate Atlas artifacts, model constants, Liquibase changelogs and data-object DTOs from the project's Flowable models
group.Flowable.GenerateLiquibase.text=Liquibase
group.Flowable.GenerateLiquibase.description=Generate Liquibase changelogs from Flowable data objects or app exports
group.Flowable.GenerateDto.text=Data-Object DTOs
group.Flowable.GenerateDto.description=Generate typed Java DTOs from Flowable data objects — a whole app at once, or hand-picked
action.Flowable.GenerateAtlasExplorer.text=Generate Atlas Explorer…
action.Flowable.GenerateAtlasExplorer.description=Map the whole project into the Atlas artifacts selected in Settings (interactive explorer HTML, Markdown, graph JSON)
action.Flowable.RegenerateAtlasExplorer.text=Regenerate Atlas Explorer
action.Flowable.RegenerateAtlasExplorer.description=Re-run the generator for the explorer page(s) that already exist, in place — same artifacts, same folder, no dialog
action.Flowable.GenerateModelConstants.text=Generate Model Constants…
action.Flowable.GenerateModelConstants.description=Generate a Java class with all Flowable model keys as constants (kept in sync)
action.Flowable.GenerateLiquibaseFromDataObject.text=From Data Object…
action.Flowable.GenerateLiquibaseFromDataObject.description=Preview and generate the Liquibase changelog for indexed data objects (extracted from the bundling app export, or synthesized from their fields), with a configurable output folder and file-name pattern
action.Flowable.GenerateLiquibaseFromApps.text=From App(s)…
action.Flowable.GenerateLiquibaseFromApps.description=Preview and extract every bundled Liquibase changelog from the project's Design-export app zips, with a configurable output folder and file-name pattern
action.Flowable.GenerateDtoFromDataObject.text=From Data Object…
action.Flowable.GenerateDtoFromDataObject.description=Preview and generate typed Java DTOs for hand-picked data objects (fields, a fromContainer(…) mapper and a fluent builder), with a configurable source root and package
action.Flowable.GenerateDtoFromApps.text=From App(s)…
action.Flowable.GenerateDtoFromApps.description=Preview and generate a typed Java DTO for every data object an app declares, with a configurable source root, package and per-app nesting

## Actions — Flowable Design
action.Flowable.PullFromDesign.text=Pull from Flowable Design
action.Flowable.PullFromDesign.description=Download the selected environment's app archives from Flowable Design into the project (the index refreshes automatically)
action.Flowable.SwitchDesignEnvironment.text=Switch Design Environment…
action.Flowable.SwitchDesignEnvironment.description=Choose which environment's Flowable Design server this project pulls models from
action.Flowable.SwitchWorkEnvironment.text=Switch Work Environment…
action.Flowable.SwitchWorkEnvironment.description=Choose which environment's running Flowable app the Expression Playground evaluates against
action.Flowable.ManageEnvironments.text=Manage Environments…
action.Flowable.ManageEnvironments.description=Open the Environments settings page: the DEV/QA/UAT/PROD list shared across your projects, and the Flowable Design and Flowable Work connection in each

## Actions — maintenance
action.Flowable.RebuildModelIndex.text=Rebuild Model Index
action.Flowable.RebuildModelIndex.description=Rescan the project's Flowable models and rebuild the key index
action.Flowable.DumpKeyIndex.text=Dump Key Index (Internal)
action.Flowable.DumpKeyIndex.description=Rescan the project and show a per-type breakdown of all indexed Flowable model keys

